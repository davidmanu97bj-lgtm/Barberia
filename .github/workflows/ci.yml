name: Validar Explora
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validar-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Node 22 · pruebas y Hosting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Dependencias del backend
        run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Configuración, sintaxis y pruebas
        run: npm test
      - name: Sintaxis de los accesos de Cloud Shell
        run: |
          for script in DESPLEGAR_EXPLORA_COMPLETO.sh He.sh tools/desplegar-explora-completo.sh tools/deploy-migracion-cloud-shell.sh tools/deploy-v4144-cloud-shell.sh; do
            bash -n "$script"
          done
      - name: Preparar paquete de Hosting
        run: npm run build
      - name: Verificar formato de cambios
        run: git diff --check
